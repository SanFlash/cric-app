services:
  # --- Backend: FastAPI, native Python runtime (no Docker) ---
  - type: web
    name: corpcric-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
        # Pinned deliberately — this project needs Python 3.11-3.13.
        # See README Troubleshooting: SQLAlchemy's typing resolution
        # breaks on 3.14, which is new enough that Render might default
        # to it in the future if this isn't pinned.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: corpcric-db
          property: connectionString
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      # CORS_ORIGINS is NOT set here on purpose — see step 5 of the
      # deployment guide. Neither service has a real URL yet at the point
      # you'd create this Blueprint, so there's nothing correct to put
      # here until after first deploy.

  # --- Frontend: Vite build, deployed as a static site ---
  - type: web
    name: corpcric-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    # VITE_API_URL is NOT set here on purpose — see step 6 of the
    # deployment guide. It has to be baked in at build time, but the
    # backend doesn't have a real URL yet at the point you'd create this
    # Blueprint. Set it after first deploy, then trigger a manual rebuild.
    routes:
      # Required for client-side routing (React Router): without this,
      # directly loading /login, /teams/5, /score/2, etc. 404s, because
      # Render's static server looks for a literal file at that path
      # instead of serving index.html and letting React Router take over.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: corpcric-db
    plan: free
