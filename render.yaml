services:
  - type: web
    name: corpcric-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: corpcric-db
          property: connectionString
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
databases:
  - name: corpcric-db
    plan: free
